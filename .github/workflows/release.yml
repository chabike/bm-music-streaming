name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o bm_music_streaming.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.0'
          cache: true

      - name: Regenerate Gradle wrapper jar
        working-directory: bm_music_streaming/android
        run: |
          gradle wrapper --gradle-version 8.6 --distribution-type all
          chmod +x gradlew

      - name: Flutter pub get
        working-directory: bm_music_streaming
        run: flutter pub get

      - name: Build release APK
        working-directory: bm_music_streaming
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: bm-music-streaming-apk
          path: bm_music_streaming/build/app/outputs/flutter-apk/app-release.apk
